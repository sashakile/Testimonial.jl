# Beads Configuration File
# This file configures default behavior for all bd commands in this repository
# All settings can also be set via environment variables (BD_* prefix)
# or overridden with command-line flags

# Beads Configuration
# Sync mode: dolt-native — uses Dolt as primary, exports JSONL to git

sync:
  mode: dolt-native

# Sync remote for Dolt (set via bd dolt remote add)
sync.remote: "git+ssh://git@github.com/sashakile/Testimonial.jl.git"

# Export audit trail events to .beads/events.jsonl on each flush/sync
events-export: true

# JSONL backup: auto-export issues to .beads/issues.jsonl on each sync
# This gets committed to git for portability
backup:
  enabled: true
  interval: 15m
  git-push: false   # Export locally — git commit handles pushing