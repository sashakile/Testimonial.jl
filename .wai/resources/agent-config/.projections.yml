projections:
  # Sync pretender config to .pretender/ for general agent visibility
  - target: .pretender
    strategy: copy
    source: pretender.toml

  # Sync testaruda config
  - target: .testaruda
    strategy: copy
    source: testaruda.toml

  # Sync lefthook config
  - target: .lefthook
    strategy: copy
    source: lefthook.yml

  # Reference the justfile
  - target: justfile
    strategy: reference
    source: justfile