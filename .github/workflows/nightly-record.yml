# Nightly recording workflow for Testimonial.jl
# Runs coverage recording on main branch, stores the CoverageIndex as an artifact
# See: openspec/specs/ci-integration/spec.md

name: Nightly Recording

on:
  schedule:
    - cron: "0 6 * * *"  # Daily at 06:00 UTC
  workflow_dispatch:  # Allow manual trigger

env:
  JULIA_VERSION: "1.12"

jobs:
  record:
    name: Record coverage index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}
      - uses: julia-actions/cache@v2

      - name: Restore previous coverage index (if any)
        id: restore-index
        uses: actions/cache/restore@v4
        with:
          path: .testimonial/
          key: testimonial-index-${{ github.sha }}
          restore-keys: |
            testimonial-index-

      - name: Instantiate root project
        run: julia --project -e 'import Pkg; Pkg.instantiate()'

      # Testimonial is unregistered; the runner project needs it as a path
      # (develop) dependency so the driver subprocess can load its deps.
      # Manifests are git-ignored, so this must run on CI. Mirrors the
      # "Set up runner project" step in ci-e2e.yml.
      - name: Set up runner project
        run: |
          cd scripts/TestimonialRunner
          julia --project=. -e '
            import Pkg
            Pkg.develop(Pkg.PackageSpec(path=joinpath(pwd(), "..", "..")))
            Pkg.resolve()
            Pkg.instantiate()
          '

      - name: Record all test items
        run: julia --project -e 'using Testimonial; Testimonial.record_all()'
        timeout-minutes: 30

      - name: Save coverage index as artifact
        uses: actions/upload-artifact@v4
        with:
          name: testimonial-index
          path: .testimonial/
          retention-days: 7

      - name: Cache coverage index for PRs
        uses: actions/cache/save@v4
        with:
          path: .testimonial/
          key: testimonial-index-${{ github.sha }}