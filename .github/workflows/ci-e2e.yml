# E2E/integration test workflow — slow subprocess tests
# Runs the full test suite including subprocess recording tests
# Triggered nightly and manually, not on every push

name: CI (E2E)

on:
  schedule:
    - cron: "0 4 * * *"  # Daily at 04:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/TestimonialRunner/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JULIA_NUM_THREADS: "2"

jobs:
  # ── Full Julia test suite (including slow subprocess tests) ──
  test:
    name: Full suite (Julia ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ["1.11", "1.12"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - run: julia --project -e 'import Pkg; Pkg.instantiate()'
      # Testimonial is unregistered; the runner project needs it as a path
      # (develop) dependency for the driver subprocess on every Julia version.
      # Inference capture (1.12+ vs older) is runtime-detected in driver.jl.
      - name: Set up runner project
        run: |
          cd scripts/TestimonialRunner
          julia --project=. -e '
            import Pkg
            Pkg.develop(Pkg.PackageSpec(path=joinpath(pwd(), "..", "..")))
            Pkg.resolve()
            Pkg.instantiate()
          '
      - name: Run full test suite (includes subprocess e2e tests)
        run: julia --project -e 'import Pkg; Pkg.test()'
        timeout-minutes: 30
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
        if: ${{ matrix.version == '1.12' }}
