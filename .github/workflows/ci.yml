# CI workflow for Testimonial.jl — runs on PRs and pushes to main
# See: openspec/project.md for CI architecture

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JULIA_VERSION: "1.12"
  JULIA_NUM_THREADS: "2"

jobs:
  # ── Julia tests ─────────────────────────────────
  test:
    name: Julia tests (Julia ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ["1.11", "1.12"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - run: julia --project -e 'import Pkg; Pkg.instantiate()'
      - name: Instantiate runner project (inference capture)
        if: ${{ matrix.version == '1.12' }}
        run: julia --project=scripts/TestimonialRunner -e 'import Pkg; Pkg.instantiate()'
      - run: julia --project -e 'import Pkg; Pkg.test()'
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
        if: ${{ matrix.version == '1.12' }}

  # ── Spec validation ────────────────────────────
  specs:
    name: OpenSpec validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install openspec
        run: npm install -g @fission-ai/openspec 2>&1
      - name: Validate specs
        run: openspec validate --strict --all 2>&1
        continue-on-error: true

  # ── Code quality — pretender ──────────────────
  lint:
    name: Code quality (pretender)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pretender
        run: cargo install pretender --locked 2>&1
      - name: Run pretender check
        run: pretender check src/ 2>&1
        continue-on-error: true

  # ── Espectacular spec checks ─────────────────
  ah-check:
    name: Spec-level checks (espectacular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install espectacular
        run: cargo install espectacular --locked 2>&1
      - name: Run espectacular check
        run: ah check 2>&1
        continue-on-error: true